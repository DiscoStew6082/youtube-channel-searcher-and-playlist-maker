[project]
name = "youtube-channel-searcher-and-playlist-maker"
version = "0.1.0"
description = "Local-first search and playlist tooling for public YouTube channel metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "httpx>=0.28.1,<1.0",
    "jinja2>=3.1.6,<4.0",
    "python-dotenv>=1.2.2,<2.0",
    "python-multipart>=0.0.32,<1.0",
    "uvicorn[standard]>=0.52.1,<1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2,<2.0",
    "pip-audit>=2.10.1,<3.0",
    "pytest>=9.1.1,<10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
