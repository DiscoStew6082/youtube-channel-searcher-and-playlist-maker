name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Run static security scan
        run: uv run --locked bandit -q -r app

      - name: Export locked dependencies
        run: uv export --locked --all-groups --no-emit-project --no-hashes --format requirements-txt --output-file "${RUNNER_TEMP}/requirements.txt"

      - name: Audit locked dependencies
        run: uv run --locked pip-audit --progress-spinner off --no-deps --disable-pip -r "${RUNNER_TEMP}/requirements.txt"
