name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Run static security scan
        run: uv run --locked bandit -q -r app

      - name: Export locked dependencies
        run: uv export --locked --all-groups --no-emit-project --no-hashes --format requirements-txt --output-file "${RUNNER_TEMP}/requirements.txt"

      - name: Audit locked dependencies
        run: uv run --locked pip-audit --progress-spinner off --no-deps --disable-pip -r "${RUNNER_TEMP}/requirements.txt"
